; SkyParkour Vibration Addon - gamepad vibration for SkyParkour v3.
; Edit in game through SKSE Menu Framework, or here: file changes apply when you load a save.
;
; fHeavyMotor = low-frequency motor (left grip), fLightMotor = high-frequency motor (right grip).
; Motor strength goes from 0.0 to 1.0, durations are in seconds.

[General]
bEnabled = true
; Multiplies every effect below (0.0 - 2.0).
fMasterStrength = 1.00
; Stay silent when vibration is turned off in the game's Controls settings.
bRespectGameVibrationSetting = true
; Log every SkyParkour and jump animation event and every fired effect to
; Documents\My Games\Skyrim Special Edition\SKSE\SkyParkourVibrationAddon.log
bDebugLog = false

[PushOff]
; Feet push off at the start of a climb, step or vault.
bEnabled = true
fHeavyMotor = 0.25
fLightMotor = 0.20
fDuration = 0.10

[Grab]
; Hands catch the ledge (or plant on the obstacle when vaulting).
bEnabled = true
fHeavyMotor = 0.65
fLightMotor = 0.60
fDuration = 0.16
; Strength multipliers by ledge type.
fScaleLedgeGrab = 0.80
fScaleVault = 0.70
fScaleLow = 0.80
fScaleMedium = 1.00
fScaleHigh = 1.15
fScaleHighest = 1.30

[Land]
; Feet land after stepping up.
bEnabled = true
fHeavyMotor = 0.50
fLightMotor = 0.35
fDuration = 0.14

[Fail]
; Not enough stamina: the climb fails and you hit the wall.
bEnabled = true
fHeavyMotor = 1.00
fLightMotor = 0.40
fDuration = 0.35

[Roll]
; Landing roll.
bEnabled = true
fHeavyMotor = 0.70
fLightMotor = 0.40
fDuration = 0.35

[Slide]
; Continuous vibration while sliding. fDuration is the fade-out when the slide ends.
bEnabled = true
fHeavyMotor = 0.10
fLightMotor = 0.40
fDuration = 0.25
; Upper limit for one slide vibration, in case the slide end is missed.
fMaxDuration = 3.00

[Jump]
; Regular (vanilla) jump: feet push off the ground.
bEnabled = true
fHeavyMotor = 0.20
fLightMotor = 0.25
fDuration = 0.10

[JumpLand]
; Landing after a regular jump or a fall. The motor values are the strength of a high fall.
bEnabled = true
fHeavyMotor = 0.95
fLightMotor = 0.50
fDuration = 0.24
; Fall height in game units that lands at full strength (about 70 units per meter).
fFullStrengthFallHeight = 600
; Share of full strength for a hop in place (0.0 - 1.0).
fMinStrength = 0.30
